<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FrameUp – video de 10 secunde</title>
<style>
:root{--bg:#F1EEF8;--fg:#0B1020;--muted:#5B6478;--btn:#0B1020;--btnfg:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070B16;--fg:#F1F5F9;--muted:#94A3B8;--btn:#F1F5F9;--btnfg:#0B1020}}
:root[data-theme="dark"]{--bg:#070B16;--fg:#F1F5F9;--muted:#94A3B8;--btn:#F1F5F9;--btnfg:#0B1020}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
.stage{position:relative;overflow:hidden;width:min(100%,calc(78vh*0.5625),420px);aspect-ratio:9/16;background:#0B1020;border-radius:18px;container-type:inline-size;color:#fff}
.abs{position:absolute;left:0;right:0;text-align:center}
.sc{position:absolute;inset:0;opacity:0}
.ring{position:absolute;left:50%;top:46%;border:1.5px solid #16203A;border-radius:50%;transform:translate(-50%,-50%)}
.r1{width:150cqw;height:150cqw}.r2{width:112cqw;height:112cqw}
.emb{position:absolute;left:50%;top:46%;width:62cqw;height:62cqw;transform:translate(-50%,-50%);overflow:visible}
.emb *{transform-box:fill-box;transform-origin:center}
.wm{font-size:17cqw;font-weight:700;letter-spacing:-.02em;line-height:1}
.wm i{font-style:normal;color:#FF6B35}
.tag{font-size:3.4cqw;letter-spacing:.9cqw;color:#8B95AD}
.word{position:absolute;left:0;right:0;top:36%;text-align:center;font-size:15cqw;font-weight:800;letter-spacing:-.02em;opacity:0}
.tl{position:absolute;left:12%;right:12%;bottom:20%;height:22cqw}
.tl b{position:absolute;bottom:0;width:13%;border-radius:1.5cqw;transform:scaleY(0);transform-origin:bottom}
.tl .ph{position:absolute;top:-4cqw;bottom:-2cqw;width:.7cqw;background:#fff;left:0;opacity:0}
.serif{font-family:Georgia,"Times New Roman",serif;font-style:italic}
.cap1{font-size:11.5cqw;line-height:1.1}
.cap2{font-size:9.5cqw;font-weight:700;color:#FF6B35;line-height:1.1;letter-spacing:-.01em}
.cn{position:absolute;width:9cqw;height:9cqw;border:0 solid #FFC857;opacity:0}
.cn.a{left:9%;top:34%;border-width:.9cqw 0 0 .9cqw}.cn.b{right:9%;top:34%;border-width:.9cqw .9cqw 0 0}
.cn.c{left:9%;top:60%;border-width:0 0 .9cqw .9cqw}.cn.d{right:9%;top:60%;border-width:0 .9cqw .9cqw 0}
.btn{display:inline-block;background:#FF6B35;color:#0B1020;font-weight:700;font-size:5cqw;padding:3.4cqw 9cqw;border-radius:99cqw}
.url{font-size:3.6cqw;letter-spacing:.4cqw;color:#A9B1C7}
.prog{position:absolute;left:8%;right:8%;bottom:5%;height:1.2cqw;background:#1E293B;border-radius:1cqw;overflow:hidden}
.prog u{display:block;height:100%;width:0;background:#FF6B35;text-decoration:none}
.ctl{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center}
.ctl button{font:inherit;font-weight:600;border:0;border-radius:99px;padding:10px 20px;background:var(--btn);color:var(--btnfg);cursor:pointer}
.ctl button:focus-visible{outline:3px solid #7C3AED;outline-offset:3px}
.ctl span{color:var(--muted);font-variant-numeric:tabular-nums}
.note{color:var(--muted);font-size:13px;margin:0;text-align:center}

.play .sc1{animation:fadeOut .4s 2.1s both}
.play .ring{animation:ringIn .9s .05s both}
.play .d1{animation:pop .6s .15s cubic-bezier(.2,1.5,.4,1) both}
.play .d2{animation:pop .6s .35s cubic-bezier(.2,1.5,.4,1) both}
.play .dot{animation:spin 6s linear infinite,pop .8s .1s both}
.play .br{animation:brIn .6s .8s cubic-bezier(.2,.9,.3,1) both}
.play .tri{animation:pop .5s 1.25s cubic-bezier(.2,1.6,.4,1) both}
.play .badge{animation:pop .5s 1.55s cubic-bezier(.2,1.6,.4,1) both}
.play .sp{animation:twinkle 1.2s ease-in-out infinite both}
.play .sc2{animation:win 2.7s 2.2s both}
.play .w1{animation:fromL .6s 2.4s cubic-bezier(.2,.9,.3,1) both}
.play .w2{animation:fromR .6s 2.55s cubic-bezier(.2,.9,.3,1) both}
.play .t2{animation:fadeUp .6s 3.1s both}
.play .ul{animation:draw .6s 3.3s both}
.play .sc3{animation:win 2.9s 4.5s both}
.play .k1{animation:word .95s 4.6s both}
.play .k2{animation:word .95s 5.5s both}
.play .k3{animation:word .95s 6.4s both}
.play .tl b{animation:barUp .5s both}
.play .ph{animation:sweep 2.6s 4.7s linear both}
.play .sc4{animation:win 2s 7.3s both}
.play .cn{animation:cnIn .6s 7.35s both}
.play .c1{animation:fadeUp .6s 7.5s both}
.play .c2{animation:fadeUp .6s 7.85s both}
.play .sc5{animation:hold .6s 9s both}
.play .btn{animation:pulse 1s 9.4s ease-in-out 2}
.play .prog u{animation:grow 10s linear both}
.final .sc5{opacity:1}
.start{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4cqw;background:rgba(11,16,32,.84);text-align:center;padding:8cqw}
.start.hide{display:none}
.start p{margin:0 0 2cqw;font-size:5.4cqw;line-height:1.35;color:#E2E8F0}
.start button{font:inherit;font-size:4.6cqw;font-weight:700;border:0;border-radius:99cqw;padding:3.2cqw 8cqw;cursor:pointer}
.start button:focus-visible{outline:3px solid #FFC857;outline-offset:3px}
#go{background:#FF6B35;color:#0B1020}
#nosnd{background:transparent;color:#CBD5E1;border:1px solid #475569}
@keyframes fadeOut{to{opacity:0}}
@keyframes win{0%{opacity:0}12%{opacity:1}88%{opacity:1}100%{opacity:0}}
@keyframes hold{from{opacity:0}to{opacity:1}}
@keyframes ringIn{from{opacity:0;transform:translate(-50%,-50%) scale(.6)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes brIn{from{opacity:0;transform:translate(var(--dx),var(--dy))}to{opacity:1;transform:none}}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1.15)}}
@keyframes fromL{from{opacity:0;transform:translateX(-30cqw)}to{opacity:1;transform:none}}
@keyframes fromR{from{opacity:0;transform:translateX(30cqw)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(5cqw)}to{opacity:1;transform:none}}
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes word{0%{opacity:0;transform:translateY(14cqw) scale(.9)}20%{opacity:1;transform:none}80%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-10cqw)}}
@keyframes barUp{to{transform:scaleY(1)}}
@keyframes sweep{0%{opacity:1;left:0}100%{opacity:1;left:100%}}
@keyframes cnIn{from{opacity:0;transform:scale(1.5)}to{opacity:1;transform:scale(1)}}
@keyframes pulse{50%{transform:scale(1.08)}}
@keyframes grow{to{width:100%}}
</style>
</head>
<body>
<div class="stage" id="stage" role="group" aria-label="Videoclip animat de 10 secunde despre FrameUp, studio de montaj video">
  <div class="ring r1"></div><div class="ring r2"></div>

  <div class="sc sc1">
    <svg class="emb" viewBox="0 0 200 200" aria-hidden="true">
      <circle class="dot" cx="100" cy="100" r="86" fill="none" stroke="#FF6B35" stroke-width="3" stroke-dasharray="1 10" stroke-linecap="round"/>
      <circle class="d1" cx="100" cy="100" r="70" fill="#7C3AED"/>
      <circle class="d2" cx="100" cy="100" r="56" fill="#0B1020"/>
      <g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <path class="br" style="--dx:-40px;--dy:-40px" d="M68 82 V68 H82"/>
        <path class="br" style="--dx:40px;--dy:-40px" d="M118 68 H132 V82"/>
        <path class="br" style="--dx:-40px;--dy:40px" d="M68 118 V132 H82"/>
        <path class="br" style="--dx:40px;--dy:40px" d="M118 132 H132 V118"/>
      </g>
      <path class="tri" d="M91 86 L91 114 L114 100 Z" fill="#FF6B35" stroke="#FF6B35" stroke-width="5" stroke-linejoin="round"/>
      <g class="badge"><circle cx="160" cy="48" r="14" fill="#FF6B35"/><path d="M153 51 L160 43 L167 51" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
      <path class="sp" d="M22 40 Q22 30 32 30 Q22 30 22 20 Q22 30 12 30 Q22 30 22 40Z" fill="#FFC857"/>
      <path class="sp" style="animation-delay:.4s" d="M182 168 Q182 160 190 160 Q182 160 182 152 Q182 160 174 160 Q182 160 182 168Z" fill="#38BDF8"/>
    </svg>
  </div>

  <div class="sc sc2">
    <div class="abs" style="top:38%"><div class="wm"><span class="w1" style="display:inline-block">Frame</span><i class="w2" style="display:inline-block">Up</i></div>
      <div class="ul" style="width:30cqw;height:1cqw;background:#FF6B35;border-radius:1cqw;margin:4cqw auto 0;transform-origin:left"></div>
      <div class="tag t2" style="margin-top:5cqw">VIDEO EDITING STUDIO</div></div>
  </div>

  <div class="sc sc3">
    <div class="word k1" style="color:#FF6B35">Tăiem.</div>
    <div class="word k2" style="color:#FFC857">Colorăm.</div>
    <div class="word k3" style="color:#38BDF8">Povestim.</div>
    <div class="tl" aria-hidden="true">
      <b style="left:0;height:35%;background:#FF6B35;animation-delay:4.7s"></b>
      <b style="left:21%;height:55%;background:#7C3AED;animation-delay:4.9s"></b>
      <b style="left:42%;height:75%;background:#FFC857;animation-delay:5.1s"></b>
      <b style="left:63%;height:100%;background:#38BDF8;animation-delay:5.3s"></b>
      <b style="left:84%;height:60%;background:#FF6B35;animation-delay:5.5s"></b>
      <span class="ph"></span>
    </div>
  </div>

  <div class="sc sc4">
    <i class="cn a"></i><i class="cn b"></i><i class="cn c"></i><i class="cn d"></i>
    <div class="abs" style="top:41%">
      <div class="serif cap1 c1">Clipurile tale,</div>
      <div class="cap2 c2" style="margin-top:2.5cqw">montate ca în film.</div>
    </div>
  </div>

  <div class="sc sc5">
    <div class="abs" style="top:34%"><div class="wm" style="font-size:15cqw">Frame<i>Up</i></div></div>
    <div class="abs" style="top:50%"><span class="btn">Comandă acum</span></div>
    <div class="abs url" style="top:62%">www.frameup.md</div>
  </div>

  <div class="prog" aria-hidden="true"><u></u></div>
  <div class="start" id="start"><p>Videoul are sunet la fiecare animație.</p><button id="go" type="button">Pornește cu sunet</button><button id="nosnd" type="button">Fără sunet</button></div>
</div>
<div class="ctl"><button id="replay" type="button">Rulează din nou</button><button id="mute" type="button">Sunet: pornit</button><span id="time">0:00 / 0:10</span></div>
<p class="note">Format vertical 9:16, potrivit pentru Reels, TikTok și Shorts.</p>
<script>
(function(){
  var st=document.getElementById('stage'),tm=document.getElementById('time'),raf,t0;
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function tick_(){var s=Math.min(10,(performance.now()-t0)/1000);tm.textContent='0:'+String(Math.floor(s)).padStart(2,'0')+' / 0:10';if(s<10)raf=requestAnimationFrame(tick_)}
  var ctx=null,master=null,out=null,nb=null,muted=reduce,ov=document.getElementById('start'),mb=document.getElementById('mute');
  function label(){mb.textContent=muted?'Sunet: oprit':'Sunet: pornit'}
  function initAudio(){
    if(ctx)return;
    var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    try{ctx=new AC()}catch(e){ctx=null;return}
    var c=ctx.createDynamicsCompressor();master=ctx.createGain();master.gain.value=muted?0:0.7;master.connect(c);c.connect(ctx.destination);
    var n=ctx.sampleRate;nb=ctx.createBuffer(1,n,n);var d=nb.getChannelData(0);for(var i=0;i<n;i++)d[i]=Math.random()*2-1;
  }
  function tone(t,f,dur,type,vol,f2){
    var o=ctx.createOscillator(),g=ctx.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);
    if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(out);o.start(t);o.stop(t+dur+0.05);
  }
  function noise(t,dur,f1,f2,vol,q){
    var s=ctx.createBufferSource();s.buffer=nb;s.loop=true;
    var b=ctx.createBiquadFilter();b.type='bandpass';b.Q.value=q||1;b.frequency.setValueAtTime(f1,t);b.frequency.exponentialRampToValueAtTime(f2,t+dur);
    var g=ctx.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+dur*0.4);g.gain.linearRampToValueAtTime(0.0001,t+dur);
    s.connect(b);b.connect(g);g.connect(out);s.start(t);s.stop(t+dur+0.05);
  }
  function pop(t,f){tone(t,f*0.6,0.16,'sine',0.5,f)}
  function tick(t){noise(t,0.05,3000,5000,0.35,2)}
  function kick(t){tone(t,150,0.2,'sine',0.9,45)}
  function hat(t){noise(t,0.06,7000,9000,0.18,0.8)}
  function chime(t,f){tone(t,f,0.9,'sine',0.22);tone(t,f*2,0.5,'sine',0.07)}
  function mar(t,f){tone(t,f,0.35,'triangle',0.35);tone(t,f*4,0.08,'sine',0.1)}
  function boom(t){tone(t,120,0.7,'sine',0.9,38);noise(t,0.3,800,100,0.3,0.7)}
  function score(b){
    tone(b,110,10,'triangle',0.05);tone(b,164.81,10,'triangle',0.035);tone(b,220,10,'triangle',0.03);
    noise(b+0.05,0.9,300,3500,0.35,0.8);
    pop(b+0.15,520);pop(b+0.35,700);
    [0.8,0.86,0.92,0.98].forEach(function(x){tick(b+x)});
    pop(b+1.25,880);chime(b+1.55,987.77);chime(b+1.8,1318.5);chime(b+2.05,1567.98);
    noise(b+2.4,0.5,400,3500,0.4,0.8);noise(b+2.55,0.5,3500,400,0.4,0.8);boom(b+2.6);
    chime(b+3.1,1046.5);noise(b+3.3,0.5,500,4000,0.2,1);
    [4.6,5.0,5.5,5.9,6.4,6.8].forEach(function(x){kick(b+x)});
    [4.8,5.2,5.7,6.1,6.6,7.0].forEach(function(x){hat(b+x)});
    tick(b+4.6);tick(b+4.68);
    chime(b+5.5,1318.5);chime(b+5.62,1567.98);
    tone(b+6.4,440,0.6,'sawtooth',0.1,880);
    [[4.7,523.25],[4.9,659.25],[5.1,783.99],[5.3,1046.5],[5.5,880]].forEach(function(n){mar(b+n[0],n[1])});
    noise(b+7.3,0.4,500,3000,0.25,0.8);
    [0,0.05,0.1,0.15].forEach(function(x){tick(b+7.35+x)});
    chime(b+7.5,659.25);chime(b+7.85,783.99);
    kick(b+9);
    [523.25,659.25,783.99,1046.5].forEach(function(f,i){chime(b+9+i*0.1,f)});
    pop(b+9.4,700);pop(b+9.85,700);
  }
  function play(){
    cancelAnimationFrame(raf);
    if(out){try{out.disconnect()}catch(e){}out=null}
    st.classList.remove('play','final');void st.offsetWidth;st.classList.add('play');
    t0=performance.now();tick2();
    if(ctx&&!muted){
      if(ctx.state==='suspended')ctx.resume();
      out=ctx.createGain();out.connect(master);score(ctx.currentTime+0.03);
    }
  }
  function tick2(){tick_();}
  document.getElementById('replay').addEventListener('click',function(){if(!muted&&!ctx)initAudio();play()});
  mb.addEventListener('click',function(){muted=!muted;if(!muted&&!ctx)initAudio();if(master)master.gain.value=muted?0:0.7;label()});
  document.getElementById('go').addEventListener('click',function(){muted=false;initAudio();label();ov.classList.add('hide');play()});
  document.getElementById('nosnd').addEventListener('click',function(){muted=true;label();ov.classList.add('hide');play()});
  label();
  if(reduce){st.classList.add('final');ov.classList.add('hide');tm.textContent='0:10 / 0:10'}
})();
</script>
</body>
</html>
